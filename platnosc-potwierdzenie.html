<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Potwierdzenie zamówienia – Odnowina</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    .confirm-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
    .confirm-card { max-width: 560px; width: 100%; background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow-md); padding: 48px 40px; text-align: center; }
    .confirm-card h1 { font-size: 2rem; margin-bottom: 12px; }
    .confirm-card p { color: var(--mid); margin-bottom: 8px; }
    .confirm-ref { font-family: var(--font-serif); font-size: 1.1rem; color: var(--earth); margin: 20px 0; }
    .confirm-order { text-align: left; background: var(--cream); border-radius: var(--radius-sm); padding: 20px; margin: 24px 0; }
    .confirm-order h4 { font-size: .95rem; margin-bottom: 10px; }
    .confirm-order-row { display: flex; justify-content: space-between; font-size: .9rem; padding: 4px 0; color: var(--charcoal); }
    .confirm-order-total { display: flex; justify-content: space-between; font-weight: 600; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--linen); }
  </style>
</head>
<body>
  <div class="confirm-wrap">
    <div class="confirm-card">
      <h1>Dziękujemy za zamówienie</h1>
      <p>Twoja płatność jest przetwarzana przez HotPay. Potwierdzenie otrzymasz e-mailem, gdy płatność zostanie zaksięgowana.</p>
      <p>Jeśli chcesz śledzić status zamówienia lub wystąpił problem z płatnością, skontaktuj się z nami podając numer referencyjny.</p>
      <div class="confirm-ref" id="refNumber"></div>
      <div class="confirm-order" id="orderSummary" style="display:none;"></div>
      <a href="index.html" class="btn btn-primary">Powrót do strony głównej →</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('sessionId');
    document.getElementById('refNumber').textContent = sessionId ? `Numer referencyjny: ${sessionId}` : '';

    const stored = localStorage.getItem('odnowina_last_order');
    if (stored) {
      try {
        const order = JSON.parse(stored);
        if (order.sessionId === sessionId) {
          const box = document.getElementById('orderSummary');
          const itemsHtml = order.items.map(i =>
            `<div class="confirm-order-row"><span>${i.name} x${i.qty}</span><span>${i.price * i.qty} zł</span></div>`
          ).join('');
          box.innerHTML = `
            <h4>Twoje zamówienie</h4>
            ${itemsHtml}
            <div class="confirm-order-row"><span>Dostawa (InPost Paczkomat – ${order.locker.name})</span><span>${order.shipping === 0 ? 'Darmowa' : order.shipping + ' zł'}</span></div>
            <div class="confirm-order-total"><span>Razem</span><span>${order.total} zł</span></div>
          `;
          box.style.display = 'block';
        }
      } catch (e) { /* ignore malformed local data */ }
      localStorage.removeItem('odnowina_last_order');
    }
  </script>
</body>
</html>
